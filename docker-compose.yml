# Glowing Space BD — production stack on one VPS.
# ./deploy/make-env.sh && ./deploy/doctor.sh && docker compose up -d --build
name: gsbd

services:
  app:
    build: .
    image: gsbd-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      PORT: "3000"
      HOST: 0.0.0.0
      TRUST_PROXY: "true"
      FRONTEND_DIR: /app/dist
      UPLOAD_DIR: /app/data/uploads
      BUILD_ID: ${BUILD_ID:-prod}
    volumes:
      - uploads:/app/data/uploads
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL}
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  internal: {}
